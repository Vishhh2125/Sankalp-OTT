events {}

http {
  resolver 127.0.0.11 ipv6=off valid=10s;

  map $upstream_cache_status $cache_status_display {
    ''      '-';
    default $upstream_cache_status;
  }

  log_format cache_log '$remote_addr - [$time_local] "$request" '
                        '$status $body_bytes_sent rt=$request_time '
                        'cache=$cache_status_display "$http_referer" "$http_user_agent"';

  access_log /var/log/nginx/access.log cache_log;

  # ─── Cloudflare real-IP passthrough ─────────────────────────────────
  # Cloudflare terminates TLS and forwards requests from its own IP pool.
  # Without these lines, every request appears to come from a CF IP and
  # your access logs / rate-limiting / geo-blocking won't see real IPs.
  # List sourced from https://www.cloudflare.com/ips-v4 (update when CF publishes new ranges).
  set_real_ip_from 103.21.244.0/22;
  set_real_ip_from 103.22.200.0/22;
  set_real_ip_from 103.31.4.0/22;
  set_real_ip_from 104.16.0.0/13;
  set_real_ip_from 104.24.0.0/14;
  set_real_ip_from 108.162.192.0/18;
  set_real_ip_from 131.0.72.0/22;
  set_real_ip_from 141.101.64.0/18;
  set_real_ip_from 162.158.0.0/15;
  set_real_ip_from 172.64.0.0/13;
  set_real_ip_from 173.245.48.0/20;
  set_real_ip_from 188.114.96.0/20;
  set_real_ip_from 190.93.240.0/20;
  set_real_ip_from 197.234.240.0/22;
  set_real_ip_from 198.41.128.0/17;
  set_real_ip_from 172.18.0.1;   # IIS/ARR on Windows host proxying to this container
  real_ip_header CF-Connecting-IP;
  real_ip_recursive on;           # peel back CF → IIS → nginx chain
  # ─────────────────────────────────────────────────────────────────────

  # ─── HLS segment cache ───────────────────────────────────────────
  # Direct signed /hls/ requests are fetched from MinIO and cached here.
  # Legacy /api/media/hls/ requests are still cached as a fallback.
  #
  # keys_zone=hls_cache:20m  → ~160 000 cache entries
  # max_size=50g             → 50 GB of cached segment data on disk
  # inactive=2h              → evict entries not accessed for 2 hours
  # ─────────────────────────────────────────────────────────────────
  proxy_cache_path /var/cache/nginx/hls
    levels=1:2
    keys_zone=hls_cache:20m
    max_size=50g
    inactive=2h
    use_temp_path=off;

  # Cache only the backend image proxy used for show thumbnails/banners.
  # Keep this separate from HLS so image churn cannot evict video segments.
  proxy_cache_path /var/cache/nginx/images
    levels=1:2
    keys_zone=image_cache:10m
    max_size=2g
    inactive=24h
    use_temp_path=off;

  # Live HLS segment cache — separate from VOD hls_cache
  proxy_cache_path /var/cache/nginx/live_hls
    levels=1:2
    keys_zone=live_hls_cache:10m
    max_size=2g
    inactive=30m
    use_temp_path=off;

  # ─── Upstream pools ──────────────────────────────────────────────
  # keepalive keeps connections warm, avoiding per-request TCP handshakes
  upstream backend_pool {
    server backend:3000;
    keepalive 64;
  }

  upstream minio_pool {
    server minio:9000;
    keepalive 32;
  }

  upstream mediamtx_pool {
    server mediamtx:8888;
    keepalive 16;
  }

  upstream mediamtx_whip_pool {
    server mediamtx:8889;
    keepalive 8;
  }

  # ─── Main server ─────────────────────────────────────────────────
  server {
    listen 80;
    absolute_redirect off;

    # Allow large admin video uploads
    client_max_body_size 5G;

    # ── Admin UI ──────────────────────────────────────────────────
    location /admin/ {
      proxy_pass http://admin/;
    }

    location = /admin {
      return 301 /admin/;
    }

    # ── WebRTC / WHIP signaling (browser go-live) ───────────────
    location ~ ^/live/.+/whip$ {
      proxy_pass http://mediamtx_whip_pool;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      
      # Disable buffering for real-time WebRTC/WHIP streams
      proxy_buffering off;
      proxy_request_buffering off;

      add_header Access-Control-Allow-Origin "*" always;
      add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
      add_header Access-Control-Allow-Headers "Content-Type" always;

      if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type" always;
        add_header Content-Length 0;
        return 204;
      }
    }

    # ── Live HLS (MediaMTX) — manifests never cached ───────────────
    location ~ ^/live/hls/.+\.m3u8$ {
      rewrite ^/live/hls/(.*)$ /$1 break;
      proxy_pass http://mediamtx_pool;
      proxy_redirect ~^https?://[^/]+(/live/.*)$ $scheme://$http_host/live/hls$1;
      proxy_redirect ~^(/live/.*)$ /live/hls$1;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # Disable buffering for real-time HLS manifests
      proxy_buffering off;
      proxy_request_buffering off;

      proxy_hide_header Access-Control-Allow-Origin;
      add_header Access-Control-Allow-Origin "*" always;
      add_header Cache-Control "no-cache, no-store, must-revalidate" always;
      add_header Pragma "no-cache" always;
    }

    # Live HLS segments — short cache (unique filenames per segment)
    location ~ ^/live/hls/.+\.(ts|m4s|mp4)$ {
      rewrite ^/live/hls/(.*)$ /$1 break;
      proxy_pass http://mediamtx_pool;
      proxy_redirect ~^https?://[^/]+(/live/.*)$ $scheme://$http_host/live/hls$1;
      proxy_redirect ~^(/live/.*)$ /live/hls$1;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      proxy_hide_header Access-Control-Allow-Origin;
      add_header Access-Control-Allow-Origin "*" always;

      proxy_cache live_hls_cache;
      proxy_cache_key $uri;
      proxy_cache_valid 200 30s;
      proxy_cache_valid 404 5s;
      add_header Cache-Control "public, max-age=30" always;
      add_header X-Cache-Status $upstream_cache_status always;
    }

    # Direct signed HLS delivery. Backend authorizes playback once, then
    # issues /hls/{expires}/{signature}/dramas/.../master.m3u8. The signature
    # covers the episode prefix so relative child playlists and segments work.
    location ~ ^/hls/(?<hls_expires>[0-9]+)/(?<hls_token>[A-Za-z0-9_-]+)/(?<hls_prefix>dramas/[^/]+/episodes/[^/]+)/(?<hls_child>.+\.(?:m3u8|ts))$ {
      secure_link      $hls_token,$hls_expires;
      secure_link_md5  "$secure_link_expires/$hls_prefix 0cc3d9a7f14d3cfe6eb43055be850b6a066b57c6564416ae18dc16573c75a6d5";

      if ($secure_link = "") { return 403; }
      if ($secure_link = "0") { return 410; }

      proxy_pass http://minio_pool/ott-media/$hls_prefix/$hls_child;
      proxy_http_version 1.1;
      proxy_set_header Connection        "";
      proxy_set_header Host              minio:9000;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      proxy_cache             hls_cache;
      proxy_cache_key         $hls_prefix/$hls_child;
      proxy_cache_valid       200 6h;
      proxy_cache_valid       404 10s;
      proxy_cache_use_stale   error timeout updating;
      proxy_cache_lock        on;
      proxy_cache_lock_timeout 5s;

      proxy_buffer_size 128k;
      proxy_buffers 4 256k;
      proxy_busy_buffers_size 256k;

      add_header Access-Control-Allow-Origin "*" always;
      add_header Cache-Control "public, max-age=600" always;
      add_header X-Cache-Status $upstream_cache_status always;
      add_header Vary "Accept-Encoding" always;
    }

    # Direct signed Raw Video delivery for offline downloads.
    location ~ ^/hls/(?<hls_expires>[0-9]+)/(?<hls_token>[A-Za-z0-9_-]+)/raw/(?<hls_episode>[^/]+)/video\.mp4$ {
      secure_link      $hls_token,$hls_expires;
      secure_link_md5  "$secure_link_expires/raw/$hls_episode 0cc3d9a7f14d3cfe6eb43055be850b6a066b57c6564416ae18dc16573c75a6d5";

      if ($secure_link = "") { return 403; }
      if ($secure_link = "0") { return 410; }

      proxy_pass http://minio_pool/ott-media/raw/$hls_episode/video.mp4;
      proxy_http_version 1.1;
      proxy_set_header Connection        "";
      proxy_set_header Host              minio:9000;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      proxy_cache             hls_cache;
      proxy_cache_key         raw/$hls_episode/video.mp4;
      proxy_cache_valid       200 6h;
      proxy_cache_valid       404 10s;
      proxy_cache_use_stale   error timeout updating;
      proxy_cache_lock        on;
      proxy_cache_lock_timeout 5s;

      proxy_buffer_size 128k;
      proxy_buffers 4 256k;
      proxy_busy_buffers_size 256k;

      add_header Access-Control-Allow-Origin "*" always;
      add_header Cache-Control "public, max-age=600" always;
      add_header X-Cache-Status $upstream_cache_status always;
      add_header Vary "Accept-Encoding" always;
      add_header Content-Disposition 'attachment; filename="video.mp4"' always;
    }

    # ── HLS .ts segments ─────────────────────────────────────────
    # Legacy fallback: older clients may still request the backend HLS proxy.
    # New playback URLs use /hls/ above and bypass Node for video bytes.
    location ~* ^/api/media/hls/.+\.ts$ {
      # Step 1: ask the backend for the presigned redirect
      proxy_pass http://backend_pool;
      proxy_http_version 1.1;
      proxy_set_header Connection        "";
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      proxy_cache             hls_cache;
      proxy_cache_key         $uri;           # keyed by /api/media/hls/…/seg_000.ts
      proxy_cache_valid       200 1h;         # segments are immutable — 1h is safe
      proxy_cache_valid       404 10s;
      proxy_cache_use_stale   error timeout updating;
      proxy_cache_lock        on;             # prevents cache stampede under concurrent load
      proxy_cache_lock_timeout 5s;

      add_header Cache-Control  "public, max-age=3600";
      add_header X-Cache-Status $upstream_cache_status;
    }

    # ── HLS .m3u8 manifests ───────────────────────────────────────
    # Manifests are rewritten by the backend to stable proxy paths.
    # VOD manifests are immutable after transcoding, so a longer TTL avoids
    # repeat backend playlist rewrites under concurrent playback.
    location ~* ^/api/media/hls/.+\.m3u8$ {
      proxy_pass http://backend_pool;
      proxy_http_version 1.1;
      proxy_set_header Connection        "";
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      proxy_cache             hls_cache;
      proxy_cache_key         $uri$is_args$args;
      proxy_cache_valid       200 15m;
      proxy_cache_use_stale   error timeout updating;
      proxy_cache_lock        on;
      proxy_cache_lock_timeout 3s;

      add_header Cache-Control  "public, max-age=900";
      add_header X-Cache-Status $upstream_cache_status;
    }

    # Cache show thumbnails/banners only. This avoids touching streaming,
    # uploads, admin APIs, or the generic MinIO S3 proxy.
    location ~* ^/api/media/image/[^/]+/(thumbnail|banner)$ {
      proxy_pass http://backend_pool;
      proxy_http_version 1.1;
      proxy_set_header Connection        "";
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      proxy_cache             image_cache;
      proxy_cache_key         $uri$is_args$args;
      proxy_cache_valid       200 1h;
      proxy_cache_valid       404 30s;
      proxy_cache_use_stale   error timeout updating;
      proxy_cache_lock        on;
      proxy_cache_lock_timeout 3s;

      proxy_hide_header Cache-Control;
      add_header Cache-Control  "public, max-age=3600";
      add_header X-Cache-Status $upstream_cache_status;
      add_header Vary "Accept-Encoding" always;
    }

    # ── All other Backend API routes ─────────────────────────────
    location /api/ {
      proxy_pass http://backend_pool;
      proxy_http_version 1.1;
      proxy_set_header Connection        "";
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api {
      return 301 /api/;
    }

    location /test {
      proxy_pass http://backend_pool/test;
    }

    # Public image reads through the bucket-style MinIO path used in saved URLs.
    location ~* ^/ott-media/dramas/[^/]+/(thumbnail|banner)\.jpg$ {
      if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, PUT, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Amz-Date, X-Amz-Content-Sha256, X-Amz-Security-Token, X-Amz-User-Agent, X-Amz-Acl, X-Amz-Meta-*" always;
        add_header Content-Length 0;
        return 204;
      }

      if ($request_method !~ ^(GET|HEAD|PUT)$) { return 403; }

      proxy_pass http://minio_pool;
      proxy_http_version 1.1;
      proxy_set_header Connection        "";
      proxy_set_header Host              minio:9000;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      client_max_body_size 5G;

      proxy_hide_header Access-Control-Allow-Origin;
      proxy_hide_header Access-Control-Allow-Methods;
      proxy_hide_header Access-Control-Allow-Headers;
      proxy_hide_header Access-Control-Allow-Credentials;

      proxy_cache             image_cache;
      proxy_cache_key         $uri$is_args$args;
      proxy_cache_valid       200 1h;
      proxy_cache_valid       404 30s;
      proxy_cache_use_stale   error timeout updating;
      proxy_cache_lock        on;
      proxy_cache_lock_timeout 3s;

      add_header Cache-Control "public, max-age=3600" always;
      add_header X-Cache-Status $upstream_cache_status always;
      add_header Access-Control-Allow-Origin "*" always;
      add_header Access-Control-Allow-Methods "GET, HEAD, PUT, OPTIONS" always;
      add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Amz-Date, X-Amz-Content-Sha256, X-Amz-Security-Token, X-Amz-User-Agent, X-Amz-Acl, X-Amz-Meta-*" always;
    }

    # Presigned admin uploads use bucket-style URLs generated with
    # MINIO_PUBLIC_HOST=http://host:8080. Only upload/preflight traffic is
    # allowed here; video playback uses signed /hls/ URLs above.
    location = /ott-media {
      if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Amz-Date, X-Amz-Content-Sha256, X-Amz-Security-Token, X-Amz-User-Agent, X-Amz-Acl, X-Amz-Meta-*" always;
        add_header Content-Length 0;
        return 204;
      }

      if ($request_method !~ ^(GET|HEAD)$) { return 403; }

      proxy_pass http://minio_pool;
      proxy_http_version 1.1;
      proxy_set_header Connection        "";
      proxy_set_header Host              $http_host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      proxy_hide_header Access-Control-Allow-Origin;
      proxy_hide_header Access-Control-Allow-Methods;
      proxy_hide_header Access-Control-Allow-Headers;
      proxy_hide_header Access-Control-Allow-Credentials;

      add_header Access-Control-Allow-Origin "*" always;
      add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
      add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Amz-Date, X-Amz-Content-Sha256, X-Amz-Security-Token, X-Amz-User-Agent, X-Amz-Acl, X-Amz-Meta-*" always;
    }

    location /ott-media/ {
      if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "PUT, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Amz-Date, X-Amz-Content-Sha256, X-Amz-Security-Token, X-Amz-User-Agent, X-Amz-Acl, X-Amz-Meta-*" always;
        add_header Content-Length 0;
        return 204;
      }

      if ($request_method !~ ^(PUT)$) { return 403; }

      proxy_pass http://minio_pool;
      proxy_http_version 1.1;
      proxy_set_header Connection        "";
      proxy_set_header Host              minio:9000;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      client_max_body_size 5G;

      proxy_hide_header Access-Control-Allow-Origin;
      proxy_hide_header Access-Control-Allow-Methods;
      proxy_hide_header Access-Control-Allow-Headers;
      proxy_hide_header Access-Control-Allow-Credentials;

      add_header Access-Control-Allow-Origin "*" always;
      add_header Access-Control-Allow-Methods "PUT, OPTIONS" always;
      add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Amz-Date, X-Amz-Content-Sha256, X-Amz-Security-Token, X-Amz-User-Agent, X-Amz-Acl, X-Amz-Meta-*" always;
    }

    # ── MinIO S3 API (admin uploads, image proxy fallback) ────────
    # Do not let the generic MinIO proxy bypass signed HLS playback.
    location ~* ^/minio-api/ott-media/dramas/.+/episodes/ {
      return 403;
    }

    location /minio-api/ {
      proxy_pass         http://minio_pool/;
      proxy_http_version 1.1;
      proxy_set_header   Connection        "";
      proxy_set_header   Host              minio:9000;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      client_max_body_size 5G;
    }

    # ── MinIO Console UI ─────────────────────────────────────────
    location /minio-console/ {
      proxy_pass http://minio:9001/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade           $http_upgrade;
      proxy_set_header Connection        "upgrade";
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Default ──────────────────────────────────────────────────
    location / {
      return 302 /admin;
    }
  }
}
